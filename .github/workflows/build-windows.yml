# CoA 飞升计划 - GitHub Actions 云端 Windows 编译（不含机器人 / bot 模块）
#
# 用法：推到 fork 仓库的 .github/workflows/ 后，Actions 标签页手动 Run workflow。
# 说明：
#   - 已用 -DMODULES=none 排除所有模块（含 playerbots 机器人模块），只编译纯核心服务端。
#   - 依赖获取方式（已规避 chocolatey 失效的下载源）：
#       Boost  : choco boost-msvc-14.3 1.84.0（官方源可用，已验证）
#       OpenSSL: choco openssl 4.1.0（slproweb 的 3.x 链接已失效，4.x 可下；本 fork 为 2026 活跃项目已适配）
#       MySQL  : 直链下载 mysql-8.0.41-winx64.zip（choco 下载源 404，改用 dev.mysql.com 跳转直链）
#   - 关键：GitHub windows-latest 当前镜像为 windows-2025-vs2026（仅含 Visual Studio 2026，无 VS2022）。
#     故不写死 "Visual Studio 17 2022" 生成器，而是用 vswhere 定位 VS 后调用 vcvarsall.bat 注入 MSVC 环境，
#     再让 CMake 自动探测已安装的 VS2026 生成器，彻底避免版本号硬编码导致 "could not find Visual Studio"。
#   - 不使用第三方 setup 类 action（远程不稳），直接复用 runner 自带工具链（cmake/vswhere/msbuild）。
#   - 产物打包前，把运行时 DLL（libmysql / libcrypto / libssl）从已安装依赖目录拷进 build/bin/Release，
#     使下载的成品可直接与 exe 一同放置运行，无需再单独找 DLL。

name: Build Windows Server (CoA, no bots)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout（含子模块）
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: 安装依赖 (Boost/OpenSSL via Choco, MySQL 直链)
        shell: pwsh
        run: |
          choco install boost-msvc-14.3 --version=1.84.0 --no-progress -y
          choco install openssl --no-progress -y
          # MySQL 8.0.41 客户端库（choco 下载源 404，改 dev.mysql.com 跳转直链）
          curl.exe -L -o C:\mysql8.zip "https://dev.mysql.com/get/Downloads/MySQL-8.0/mysql-8.0.41-winx64.zip"
          Expand-Archive C:\mysql8.zip -DestinationPath C:\mysql8
          # 动态定位并导出 CMake 所需的依赖路径
          $boost = Get-ChildItem "C:\local" -Filter "boost_*" -Directory -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($boost)   { Add-Content -Path $env:GITHUB_ENV -Value "BOOST_ROOT=$($boost.FullName)" }
          $openssl = Get-ChildItem "C:\Program Files" -Filter "OpenSSL*" -Directory -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($openssl) { Add-Content -Path $env:GITHUB_ENV -Value "OPENSSL_ROOT_DIR=$($openssl.FullName)" }
          $mysql = Get-ChildItem "C:\mysql8" -Directory -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($mysql)   { Add-Content -Path $env:GITHUB_ENV -Value "MYSQL_DIR=$($mysql.FullName)" }
          Write-Host "BOOST_ROOT=$env:BOOST_ROOT"
          Write-Host "OPENSSL_ROOT_DIR=$env:OPENSSL_ROOT_DIR"
          Write-Host "MYSQL_DIR=$env:MYSQL_DIR"

      - name: 定位 Visual Studio 安装路径
        shell: pwsh
        run: |
          $vswhere = "C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath 2>$null
          if (-not $vsPath) { $vsPath = & $vswhere -latest -property installationPath 2>$null }
          Write-Host "VS instance: $vsPath"
          if (-not $vsPath) { Write-Error "未找到 Visual Studio 实例"; exit 1 }
          Add-Content -Path $env:GITHUB_ENV -Value "VS_INSTANCE=$vsPath"

      - name: CMake 配置 + 编译（vcvarsall 注入 MSVC，自动探测 VS2026 生成器）
        shell: cmd
        run: |
          call "%VS_INSTANCE%\VC\Auxiliary\Build\vcvarsall.bat" x64
          cmake --version
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DTOOLS_BUILD=all -DSCRIPTS=static -DMODULES=none -DBOOST_ROOT="%BOOST_ROOT%" -DOPENSSL_ROOT_DIR="%OPENSSL_ROOT_DIR%" -DMYSQL_DIR="%MYSQL_DIR%"
          cmake --build build --config Release --target worldserver authserver

      - name: 收集运行时 DLL 进产物目录
        shell: pwsh
        run: |
          $rel = "build\bin\Release"
          if (-not (Test-Path $rel)) { Write-Error "未找到 $rel，编译可能失败"; exit 1 }
          # MySQL 客户端库
          $mysqlDll = Join-Path $env:MYSQL_DIR "lib\libmysql.dll"
          if (Test-Path $mysqlDll) { Copy-Item $mysqlDll $rel; Write-Host "已复制 libmysql.dll" }
          else { Write-Error "libmysql.dll 未找到: $mysqlDll"; exit 1 }
          # OpenSSL
          $sslBin = Join-Path $env:OPENSSL_ROOT_DIR "bin"
          $c = Join-Path $sslBin "libcrypto-3-x64.dll"
          $s = Join-Path $sslBin "libssl-3-x64.dll"
          if ((Test-Path $c) -and (Test-Path $s)) {
            Copy-Item $c $rel; Copy-Item $s $rel
            Write-Host "已复制 libcrypto-3-x64.dll / libssl-3-x64.dll"
          } else { Write-Error "OpenSSL DLL 未找到: $sslBin"; exit 1 }
          Write-Host "=== 产物目录 DLL ==="
          Get-ChildItem $rel -Filter *.dll | Select-Object Name

      - name: 上传编译产物
        uses: actions/upload-artifact@v4
        with:
          name: coa-windows-server
          path: build/bin/Release/
