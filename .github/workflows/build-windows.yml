# CoA 飞升计划 - GitHub Actions 云端 Windows 编译（不含机器人 / bot 模块）
#
# 「即插即用」步骤：
#   1) 在 GitHub 上 fork 该仓库到你的账号
#   2) 将此文件放到你 fork 仓库的  .github/workflows/  目录（建议改名 build-windows.yml）并提交
#   3) 进入仓库的 Actions 标签页 -> 选择该工作流 -> Run workflow（手动触发）
#   4) 运行结束后，在 Artifacts 中下载 coa-windows-server（含 worldserver.exe / authserver.exe）
#
# 说明：
#   - 已用 -DMODULES=none 排除所有模块（含 playerbots 机器人模块），只编译纯核心服务端。
#   - 依赖通过 Chocolatey 安装预编译包（openssl / boost / mysql），比 vcpkg 源码编译快很多。
#   - 云端 runner 首次编译较慢；若依赖查找报错，按日志微调下方 choco 安装命令或环境变量即可。

name: Build Windows Server (CoA, no bots)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout（含子模块）
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: 安装依赖 (OpenSSL / Boost / MySQL) via Chocolatey
        shell: pwsh
        run: |
          choco install openssl boost-msvc mysql --no-progress -y
          # 动态定位并导出 CMake 所需的依赖路径
          $boost = Get-ChildItem "C:\local" -Filter "boost_*" -Directory | Select-Object -First 1
          if ($boost) { Add-Content -Path $env:GITHUB_ENV -Value "BOOST_ROOT=$($boost.FullName)" }
          $openssl = Get-ChildItem "C:\Program Files" -Filter "OpenSSL*" -Directory | Select-Object -First 1
          if ($openssl) { Add-Content -Path $env:GITHUB_ENV -Value "OPENSSL_ROOT_DIR=$($openssl.FullName)" }
          $mysql = Get-ChildItem "C:\Program Files\MySQL" -Filter "MySQL Server*" -Directory | Select-Object -First 1
          if ($mysql) { Add-Content -Path $env:GITHUB_ENV -Value "MYSQL_DIR=$($mysql.FullName)" }

      - name: CMake 配置（排除机器人模块）
        run: cmake -B build -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_BUILD_TYPE=Release `
            -DTOOLS_BUILD=all `
            -DSCRIPTS=static `
            -DMODULES=none

      - name: 编译 worldserver / authserver
        run: cmake --build build --config Release --target worldserver authserver

      - name: 上传编译产物
        uses: actions/upload-artifact@v4
        with:
          name: coa-windows-server
          path: build/bin/Release/
