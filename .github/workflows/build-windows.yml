# CoA 飞升计划 - GitHub Actions 云端 Windows 编译（不含机器人 / bot 模块）
#
# 用法：推到 fork 仓库的 .github/workflows/ 后，Actions 标签页手动 Run workflow。
# 说明：
#   - 已用 -DMODULES=none 排除所有模块（含 playerbots 机器人模块），只编译纯核心服务端。
#   - 依赖通过 Chocolatey 安装预编译包（已锁定到与 VS2022 / AC 3.3.5 验证过的版本）：
#       openssl 3.4.1 / boost-msvc-14.3 1.84.0 / mysql 8.0.41
#   - 依赖路径动态探测后写入 GITHUB_ENV，并在 CMake 配置时以 -D 显式传入，避免找不到。

name: Build Windows Server (CoA, no bots)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout（含子模块）
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: 安装依赖 (OpenSSL / Boost / MySQL) via Chocolatey
        shell: pwsh
        run: |
          choco install openssl --version=3.4.1 --no-progress -y
          choco install boost-msvc-14.3 --version=1.84.0 --no-progress -y
          choco install mysql --version=8.0.41 --no-progress -y
          # 动态定位并导出 CMake 所需的依赖路径（路径不存在时不报错）
          $boost = Get-ChildItem "C:\local" -Filter "boost_*" -Directory -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($boost) { Add-Content -Path $env:GITHUB_ENV -Value "BOOST_ROOT=$($boost.FullName)" }
          $openssl = Get-ChildItem "C:\Program Files" -Filter "OpenSSL*" -Directory -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($openssl) { Add-Content -Path $env:GITHUB_ENV -Value "OPENSSL_ROOT_DIR=$($openssl.FullName)" }
          $mysql = Get-ChildItem "C:\Program Files\MySQL" -Filter "MySQL Server*" -Directory -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($mysql) { Add-Content -Path $env:GITHUB_ENV -Value "MYSQL_DIR=$($mysql.FullName)" }
          Write-Host "BOOST_ROOT=$env:BOOST_ROOT"
          Write-Host "OPENSSL_ROOT_DIR=$env:OPENSSL_ROOT_DIR"
          Write-Host "MYSQL_DIR=$env:MYSQL_DIR"

      - name: CMake 配置（排除机器人模块）
        shell: pwsh
        run: |
          $args = @('-B','build','-G','Visual Studio 17 2022','-A','x64',
            '-DCMAKE_BUILD_TYPE=Release','-DTOOLS_BUILD=all','-DSCRIPTS=static','-DMODULES=none')
          if ($env:BOOST_ROOT)       { $args += "-DBOOST_ROOT=$env:BOOST_ROOT" }
          if ($env:OPENSSL_ROOT_DIR) { $args += "-DOPENSSL_ROOT_DIR=$env:OPENSSL_ROOT_DIR" }
          if ($env:MYSQL_DIR)        { $args += "-DMYSQL_DIR=$env:MYSQL_DIR" }
          cmake @args

      - name: 编译 worldserver / authserver
        run: cmake --build build --config Release --target worldserver authserver

      - name: 上传编译产物
        uses: actions/upload-artifact@v4
        with:
          name: coa-windows-server
          path: build/bin/Release/
